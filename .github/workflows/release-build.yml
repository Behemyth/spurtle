name: Release Build

# Builds and publishes dev/stable releases to GitHub Releases using Velopack.
# Triggered by Python dev release updates, published releases, or manual dispatch.

on:
  workflow_run:
    workflows: ["Update Python Development Release"]
    types: [completed]
    branches:
      - development
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  get-version:
    if: github.repository == 'synodic/spurtle' && (github.event_name !=
      'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer-version: ${{ steps.version.outputs.installer-version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      is-dev: ${{ steps.version.outputs.is-dev }}
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install PDM
        if: github.event_name == 'workflow_run'
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.15"
          cache: true

      - name: Install dependencies
        if: github.event_name == 'workflow_run'
        run: pdm install

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # pdm run version outputs version=<pep440> and installer-version=<semver>
            pdm run version >> $GITHUB_OUTPUT
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "is-dev=true" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" == "release" ]; then
              version_input="${{ github.event.release.tag_name }}"
            else
              version_input="${{ inputs.version }}"
            fi
            version="${version_input#v}"
            echo "version=${version}" >> $GITHUB_OUTPUT
            echo "installer-version=${version}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "tag=v${version}" >> $GITHUB_OUTPUT
            echo "is-dev=false" >> $GITHUB_OUTPUT
          fi

  build-and-package:
    needs: get-version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.get-version.outputs.installer-version }}
      channel: ${{ needs.get-version.outputs.channel }}

  release:
    needs: [get-version, build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: velopack-release-*
          path: releases
          merge-multiple: true

      - name: Clear dev release assets
        if: needs.get-version.outputs.is-dev == 'true'
        continue-on-error: true
        run:
          gh release view dev --json assets -q '.assets[].name' | xargs -I {} gh
          release delete-asset dev {} --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create or update dev release
        if: needs.get-version.outputs.is-dev == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build"
          prerelease: true
          make_latest: false
          files: releases/*
          body: |
            **Latest Development Build**

            Version: `${{ needs.get-version.outputs.version }}`
            Commit: `${{ github.sha }}`

            ⚠️ This is a development build and may be unstable.

            ## Installation
            - **Windows**: Download `spurtle-Setup.exe` and run it
            - **Linux**: Download the `.AppImage` file, make it executable with `chmod +x`, and run
            - **macOS**: Download and extract the package

      - name: Upload to existing release
        if: needs.get-version.outputs.is-dev != 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*

      - name: Create release
        if: needs.get-version.outputs.is-dev != 'true' && github.event_name ==
          'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: "Release ${{ needs.get-version.outputs.version }}"
          draft: true
          files: releases/*
          body: |
            **Release ${{ needs.get-version.outputs.version }}**

            ## Installation
            - **Windows**: Download `spurtle-Setup.exe` and run it
            - **Linux**: Download the `.AppImage` file, make it executable with `chmod +x`, and run
            - **macOS**: Download and extract the package
