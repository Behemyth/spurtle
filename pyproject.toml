
[project]
description = ""
license = { text = "LGPL-3.0-or-later" }
name = "spurtle"

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.15, <3.16"

dependencies = [
    "pyside6>=6.12.0",
    "packaging>=26.3",
    "porringer>=0.3.1",
    "qasync>=0.28.0",
    "typer>=0.27.3",
]

[project.urls]
homepage = "https://github.com/synodic/spurtle"
repository = "https://github.com/synodic/spurtle"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
lint = [
    "ruff>=0.17.1",
    "pyrefly>=1.4.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[project.scripts]
sprt = "spurtle.cli:app"

[project.gui-scripts]
spurtle = "spurtle.application.qt:application"

[tool.pytest.ini_options]
log_cli = true
testpaths = ["tests"]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = ["D206", "D300", "D415", "E111", "E114", "E117", "PLC0415", "PLR0913"]
select = [
    "D",   # pydocstyle
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # pylint
    "UP",  # pyupgrade
    "E",   # pycodestyle
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.version]
source = "scm"

[tool.pdm.resolution]
allow-prereleases = true

[tool.pdm.scripts]
analyze = "ruff check"
dev = "spurtle --dev"
format = "ruff format"
lint = { composite = ["analyze", "format", "type-check"] }
package = { call = "tool.scripts.package:main" }
version = { call = "tool.scripts.version:main" }
post_install = { call = "tool.scripts.setup_dev:main" }
test = "pytest --cov=spurtle --verbose tests"
type-check = "pyrefly check"
serve = "zensical serve"

# https://pdm-backend.fming.dev/build_config/#wheel-data-files
[tool.pdm.build.wheel-data]
data = [{ path = "data/**/*", relative-to = "data/" }]


[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
